<title>Epoch</title>

<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-000); color: var(--ink-900); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 640px; height: 288px; }
  .brand { fill: var(--primary); }
  .tint { fill: var(--primary-soft); }
  .deep { fill: var(--ink-900); }
  .loss { fill: var(--series-2); }
  .ok { fill: var(--success); }
  .slab { rx: var(--radius-lg); }
  .blk { rx: var(--radius-md); }
  .plus { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: square; }
  /* name and tagline, bottom-left on the ground */
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .9; font-weight: 600; letter-spacing: -.03em; color: var(--ink-900); }
  .tag { margin: var(--space-2) 0 0 var(--space-1); font-size: 14px; line-height: 20px; color: var(--ink-500); }
</style>
</head>

<div class="cover">

<!--
  blocks      primary 160×256 bled off the top (the one hue the system is known by) · primary-soft 192×176 (the tint, relief) · ink-900 224×256 bleeding off the right edge (the deep slab; in dark it is the pale one) · series-2 96×48 (loss orange, the chart's second voice) · success 64×24 once (it only ever means "완료") — about half of 960×288
  arrangement one tall primary slab, a tint block and a deep slab to its right, the two small signals stacked above the tint; bottoms on one line space-4 above the edge, space-4 gutters
  pattern     a plus grid, from "precise, technical, mono, a 4px grid": the README's first principle is that numbers are the subject and everything sits on a 4px grid, so the marks are crosshairs at one spacing step, inside the tint block only, in primary
  scales      sides in space-4 multiples (160 = 10×16, 192 = 12×16, 176 = 11×16, 96, 48, 64, 24); gutters space-4; pitch space-5 (24px), arms space-2 (8px); slab corners radius-lg, small blocks radius-md
-->
